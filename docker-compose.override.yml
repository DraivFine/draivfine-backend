# Chargé automatiquement par `docker compose` en plus de docker-compose.yml.
# Monte le code source en volume et lance les serveurs en mode watch, pour que
# les modifications soient prises en compte sans rebuild d'image. Le
# node_modules du conteneur (compilé pour Linux, ex. bcrypt) est protégé du
# bind mount par un volume dédié — sinon un node_modules Windows local
# l'écraserait.
services:
  api:
    build:
      target: builder
    command: npm run start:dev
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules

  ml-service:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ../draivfine-ml/app:/app/app
      - ../draivfine-ml/training:/app/training
